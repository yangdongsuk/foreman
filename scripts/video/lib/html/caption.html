<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="{{base}}">
<link rel="stylesheet" href="../../slides/base.css">
<style>
  html, body { width: 1920px; height: 240px; background: transparent; }
  body { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 56px; }
  #cap {
    display: none; max-width: 1560px; padding: 14px 34px 16px; border-radius: 18px; text-align: center;
    background: rgba(5, 8, 20, 0.80); border: 1px solid rgba(160, 175, 255, 0.16);
    font: 600 38px/1.32 var(--font); color: #fff; letter-spacing: 0.005em; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
<div id="cap"></div>
<script>
  window.__setCaption = function (html) {
    var el = document.getElementById('cap');
    el.innerHTML = html;
    el.style.display = html ? 'block' : 'none';
  };
</script>
</body>
</html>
