<!doctype html>
<html><head><meta charset="utf-8"><title>policy card</title>
<style>
  html,body{margin:0;width:1400px;height:900px;background:#0a0f1f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f4f6ff}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 20% 0%,rgba(124,92,255,.35),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(39,117,202,.35),transparent 60%),#0a0f1f}
  .card{width:1000px;border-radius:32px;border:1px solid rgba(160,175,255,.25);background:rgba(18,26,56,.85);padding:56px 64px;box-shadow:0 40px 100px rgba(2,4,14,.6)}
  .tag{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#a894ff;font-weight:650}
  h1{margin:14px 0 36px;font-size:60px;letter-spacing:-.03em}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-top:1px solid rgba(160,175,255,.16);font-size:30px}
  .row span:first-child{color:#9aa7d1}.row b{font-weight:650}
  .big{font-size:44px;background:linear-gradient(90deg,#fff,#a894ff);-webkit-background-clip:text;color:transparent}
  .ok{color:#45e0a0}
  .note{margin-top:28px;font-size:22px;color:#6c79a6}
</style></head><body>
<div class="card"><div class="tag">ForemanPolicy · enforced by the contract</div><h1>Mandate</h1>
<div class="row"><span>Auto-approve cap</span><b class="big">50.00 USDC</b></div>
<div class="row"><span>Daily cap</span><b class="big">200.00 USDC</b></div>
<div class="row"><span>Agent key holds</span><b>gas only</b></div>
<div class="row"><span>Owner kill switch</span><b class="ok">armed</b></div>
<div class="note">example values for the toolkit sample</div></div></body></html>
